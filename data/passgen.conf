# Example configuration for passgen.
#
# Every line is `preset name:pattern`, `wordlist name:path` or `random source`.
# Note that this format is not stable yet, and may change in a future version.

# eff wordlists, sourced from https://www.eff.org/dice. these are installed
# along with passgen if they were downloaded with scripts/fetch-wordlists.sh
# before building.
wordlist eff-large:/usr/share/passgen/eff-large.txt
wordlist eff-short-1:/usr/share/passgen/eff-short-1.txt
wordlist eff-short-2:/usr/share/passgen/eff-short-2.txt

# six words from the large eff wordlist, as recommended by the eff
preset eff:\w{eff-large}(-\w{eff-large}){5}

# six pronounceable words, generated from the large eff wordlist
preset eff-markov:\m{eff-large}(-\m{eff-large}){5}
