name: Release

# Pushing a tag like `v1.2.3` builds release artifacts for all supported
# platforms and publishes them as a GitHub release. The tag has to match the
# version in CMakeLists.txt.
#
# Running this workflow manually builds the artifacts without publishing
# anything, which is useful to check that a release would work.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          version="$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version in CMakeLists.txt is $version"

      - name: Check that the tag matches the version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if test "v$VERSION" != "$GITHUB_REF_NAME"; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $VERSION in CMakeLists.txt"
            exit 1
          fi

  # Statically linked binaries (built on Alpine against musl), these run on
  # any Linux distribution. The archive only has the binary (and its man
  # page), as it is for people who only want the command-line tool.
  linux-static:
    name: linux / ${{ matrix.arch }} / static
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      PACKAGE: passgen-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}-static
    steps:
      - uses: actions/checkout@v4

      # This runs in a plain `docker run` rather than a job container, because
      # JavaScript actions don't work in Alpine containers on ARM runners.
      - name: Build, test and package
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e PACKAGE -e GITHUB_SHA alpine:3.24 sh -euxc '
            apk add --no-cache build-base cmake ninja ruby bash git
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DPASSGEN_STATIC=ON \
              -DLIBPASSGEN_SHARED=OFF \
              -DUSE_BACKTRACE=OFF \
              -DBUILD_BENCH=OFF \
              -DBUILD_GIT_INFO=OFF \
              -DPASSGEN_BUILD_INFO="$GITHUB_SHA"
            cmake --build build
            ctest --test-dir build --output-on-failure
            ./scripts/test-relocatable.sh build
            ./scripts/package-archive.sh build "$PACKAGE" runtime
          '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-static-${{ matrix.arch }}
          path: ${{ env.PACKAGE }}.tar.xz
          if-no-files-found: error

  # The library and the command-line tool, which is linked against it, built
  # against glibc on an older Ubuntu, so that they run on systems which are
  # not quite as old as that. As a Debian package, and as an archive which
  # works wherever it is unpacked.
  linux:
    name: linux / ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    env:
      PACKAGE: passgen-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build ruby

      - name: Fetch wordlists
        run: ./scripts/fetch-wordlists.sh

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DPASSGEN_CLI_SHARED=ON \
            -DBUILD_BENCH=OFF \
            -DBUILD_GIT_INFO=OFF \
            -DPASSGEN_BUILD_INFO="$GITHUB_SHA"
          cmake --build build

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          ./scripts/test-relocatable.sh build

      # both end up next to each other, so that the artifact does not have
      # any directories in it (it keeps them, relative to where its files
      # are, which the release would then have, too).
      - name: Package
        run: |
          (cd build && cpack -G DEB)
          mv build/*.deb .
          ./scripts/package-archive.sh build "$PACKAGE"

      # the package installs, and what it installs works from there: the
      # command-line tool, and building against the library.
      - name: Install the package
        run: |
          sudo apt-get install -y ./*.deb
          passgen --version
          test "$(passgen -r zero '[a-z]{8}')" = aaaaaaaa
          cc -o /tmp/generate examples/generate.c $(pkg-config --cflags --libs passgen)
          /tmp/generate '[a-z]{8}'

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            *.deb
            ${{ env.PACKAGE }}.tar.xz
          if-no-files-found: error

  # RPM packages, built on AlmaLinux 9, so that they work on RHEL, Rocky and
  # AlmaLinux 9 and newer, and on current versions of Fedora. Libraries go to
  # lib64, as they do there.
  linux-rpm:
    name: linux / ${{ matrix.arch }} / rpm
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Fetch wordlists
        run: ./scripts/fetch-wordlists.sh

      # This runs in a plain `docker run` rather than a job container, like
      # the static build. Once packaged, the package is installed, and what
      # it installs has to work from there: the command-line tool, and
      # building against the library (which is found in lib64 without a run
      # path).
      - name: Build, test, package and install
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e GITHUB_SHA almalinux:9 bash -euxc '
            dnf install -y gcc make cmake ruby git rpm-build pkgconf-pkg-config binutils
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=lib64 \
              -DPASSGEN_CLI_SHARED=ON \
              -DBUILD_BENCH=OFF \
              -DBUILD_GIT_INFO=OFF \
              -DPASSGEN_BUILD_INFO="$GITHUB_SHA"
            cmake --build build -j "$(nproc)"
            ctest --test-dir build --output-on-failure
            ./scripts/test-relocatable.sh build
            (cd build && cpack -G RPM)
            dnf install -y ./build/*.rpm
            passgen --version
            test "$(passgen -r zero "[a-z]{8}")" = aaaaaaaa
            gcc -o /tmp/generate examples/generate.c $(pkg-config --cflags --libs passgen)
            /tmp/generate "[a-z]{8}"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-${{ matrix.arch }}
          path: build/*.rpm
          if-no-files-found: error

  macos:
    name: macos / arm64
    needs: version
    runs-on: macos-latest
    env:
      PACKAGE: passgen-${{ needs.version.outputs.version }}-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ninja

      - name: Fetch wordlists
        run: ./scripts/fetch-wordlists.sh

      # The command-line tool is linked against libpassgen.dylib, which it
      # finds relative to where it is, so that the archive works wherever it
      # is unpacked.
      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPASSGEN_CLI_SHARED=ON \
            -DBUILD_BENCH=OFF \
            -DBUILD_GIT_INFO=OFF \
            -DPASSGEN_BUILD_INFO="$GITHUB_SHA"
          cmake --build build

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          ./scripts/test-relocatable.sh build

      - name: Package
        run: ./scripts/package-archive.sh build "$PACKAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ${{ env.PACKAGE }}.tar.xz
          if-no-files-found: error

  source:
    name: source
    needs: version
    runs-on: ubuntu-latest
    env:
      PACKAGE: passgen-${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Create source archive
        run: git archive --format=tar.gz --prefix="$PACKAGE/" -o "$PACKAGE-source.tar.gz" HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: ${{ env.PACKAGE }}-source.tar.gz
          if-no-files-found: error

  # Everything up to creating the release also runs when the workflow is
  # started by hand, so that a dry run finds problems with the files of the
  # release, too.
  publish:
    name: publish release
    needs: [version, linux-static, linux, linux-rpm, macos, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # the release is the files, without any directories.
      - name: Checksums
        working-directory: artifacts
        run: |
          ls -la
          if find . -mindepth 1 -type d | grep -q .; then
            echo "::error::the artifacts have directories in them"
            exit 1
          fi
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Passgen $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*
